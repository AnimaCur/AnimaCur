    <style>
      :root {

      html {

        color-scheme: light;

        background-attachment: fixed;
      }

      h1, h2, h3, h4, .font-display {
        font-family: var(--font-display);
      }

      /* Warm Beige Canvas with Quiet Gold & Black Gradient Accents */
      .surface-beige {
        background: linear-gradient(145deg, #fffdf9 0%, #f5efe3 100%);
        border: 1px solid rgba(20, 20, 23, 0.1);
      }

      .surface-beige-elevated {
        background: linear-gradient(160deg, #ffffff 0%, #f7f2e7 100%);
        border: 1px solid rgba(169, 129, 58, 0.22);
      }

      .surface-beige-gold {
        background: linear-gradient(
          135deg,
          rgba(212, 175, 106, 0.14) 0%,
          rgba(255, 253, 249, 0.94) 50%,
          rgba(244, 238, 226, 0.98) 100%
        );
        border: 1px solid rgba(169, 129, 58, 0.26);
      }

      /* Black icon backgrounds & dark gradient surfaces */
      .icon-box-black {
        background: linear-gradient(145deg, #242429 0%, #101013 100%);
        border: 1px solid rgba(212, 175, 106, 0.3);
        color: #e6cb92;
        box-shadow: 0 8px 18px -6px rgba(16, 16, 19, 0.32);
      }

      .text-black-gradient {
        background: linear-gradient(135deg, #0d0d10 0%, #262421 55%, #3d372c 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .text-gold-gradient {
        background: linear-gradient(135deg, #f3e0b5 0%, #d4af6a 50%, #a9813a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .btn-gold-primary {
        background: linear-gradient(135deg, #dfc083 0%, #c19a50 100%);
        color: #111114;
        border: 1px solid rgba(154, 115, 27, 0.35);
        box-shadow: 0 10px 24px -8px rgba(169, 129, 58, 0.32);
        transition:
          transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
          filter 180ms cubic-bezier(0.16, 1, 0.3, 1),
          box-shadow 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .btn-gold-primary:hover {
        filter: brightness(1.04);
        transform: translateY(-1px);
        box-shadow: 0 14px 28px -8px rgba(169, 129, 58, 0.42);
      }

      .btn-gold-primary:active {
        transform: translateY(0);
      }

      .btn-black-outline {
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.72) 0%, rgba(244, 239, 230, 0.85) 100%);
        color: #141417;
        border: 1px solid rgba(20, 20, 23, 0.22);
        transition:
          transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
          background 180ms cubic-bezier(0.16, 1, 0.3, 1),
          color 180ms cubic-bezier(0.16, 1, 0.3, 1),
          border-color 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .btn-black-outline:hover {
        background: linear-gradient(145deg, #222227 0%, #101013 100%);
        color: #ebd39f;
        border-color: rgba(212, 175, 106, 0.45);
        transform: translateY(-1px);
      }

      .hairline-gold {
        height: 1px;
        background: linear-gradient(90deg, transparent 0%, rgba(169, 129, 58, 0.35) 50%, transparent 100%);
      }

      /* Custom warm beige & gold scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #f2ece0;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #b58c42, #242429);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #c19a50, #141417);
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
